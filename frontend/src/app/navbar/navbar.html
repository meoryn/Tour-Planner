<div class="px-4 md:px-8 py-4 flex justify-between items-center gap-4 shadow-md sticky top-0 z-10 bg-white">
  <div>
    <span class="text-xl font-bold cursor-pointer" [routerLink]="'/'"> Tour-Planner </span>
  </div>

  <!-- Desktop links -->
  <div class="hidden md:flex gap-4 items-center">
    @if (currentUser()) {
      <a [routerLink]="'/tour/add'" class="text-green-500 hover:underline cursor-pointer">Create Tour</a>
      <a [routerLink]="'/tourlist'" class="text-green-500 hover:underline cursor-pointer">Tour List</a>
      <span class="text-gray-300">|</span>
      <span class="text-gray-700">{{ currentUser()!.username }}</span>
      <button pButton label="Logout" [text]="true" (click)="logout()"></button>
    } @else {
      <a [routerLink]="'/login'" class="text-green-500 hover:underline cursor-pointer">Login</a>
      <a [routerLink]="'/register'" class="text-green-500 hover:underline cursor-pointer">Register</a>
    }
  </div>

  <!-- Mobile hamburger button -->
  <button pButton [text]="true" icon="pi pi-bars" class="block md:hidden!" (click)="drawerVisible.set(true)"></button>
</div>

<!-- Mobile drawer -->
<p-drawer [(visible)]="drawerVisible" position="right" [style]="{ width: '16rem' }">
  <ng-template #header>
    <span class="font-bold text-lg">Menu</span>
  </ng-template>
  <div class="flex flex-col gap-4">
    @if (currentUser()) {
      <span class="text-gray-700 font-semibold">{{ currentUser()!.username }}</span>
      <a [routerLink]="'/tour/add'" class="text-green-500 hover:underline cursor-pointer" (click)="drawerVisible.set(false)">Create Tour</a>
      <a [routerLink]="'/tourlist'" class="text-green-500 hover:underline cursor-pointer" (click)="drawerVisible.set(false)">Tour List</a>
      <button pButton label="Logout" [text]="true" (click)="logout()"></button>
    } @else {
      <a [routerLink]="'/login'" class="text-green-500 hover:underline cursor-pointer" (click)="drawerVisible.set(false)">Login</a>
      <a [routerLink]="'/register'" class="text-green-500 hover:underline cursor-pointer" (click)="drawerVisible.set(false)">Register</a>
    }
  </div>
</p-drawer>
