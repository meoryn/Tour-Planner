<p-card class="w-full">
  <div class="flex flex-col md:flex-row justify-between items-center mb-4 min-w-0">
    <div class="flex flex-col md:flex-row items-center gap-1 md:gap-4 text-sm md:text-base min-w-0">
      <h2 class="text-xl md:text-3xl font-bold wrap-break-word text-center md:text-left hover:text-emerald-500 cursor-pointer" [routerLink]="`/tour/${tour.id}/edit`">{{ tour.title }}</h2>
      <span class="text-gray-300 hidden md:inline">|</span>
      <span>{{ tour.from.label }} &rarr; {{ tour.to.label }}</span>
      <span class="text-gray-300 hidden md:inline">|</span>
      <span class="flex md:contents items-center gap-2">
        <span>{{ tour.totalDistance | number: '1.0-1' }}km</span>
        <span class="text-gray-300 hidden md:inline">|</span>
        <span>{{ tour.totalDuration | number: '1.0-1' }}min</span>
        <span class="text-gray-300 hidden md:inline">|</span>
        <span>{{ formatTransport(tour.transportType) }}</span>
      </span>
    </div>
    <div class="flex items-center gap-2 mt-2 md:mt-0">
      <button pButton label="Export Tour" [text]="true" (click)="exportTour()"></button>
      <button pButton label="Tour Logs" [text]="true" (click)="showLogs()"></button>
      <button pButton label="Remove Tour" [text]="true" severity="danger" (click)="removeTour()"></button>

    </div>
  </div>
  <p class="wrap-break-word">{{ tour.description }}</p>
</p-card>

<app-tour-logs-dialog [(visible)]="logsDialogVisible" />
